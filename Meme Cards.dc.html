body{margin:0;background:#1f1b17;}

<div style="min-height:100vh;background:#1f1b17;color:#f1e9da;font-family:'Barlow',sans-serif;padding:56px 32px 80px;box-sizing:border-box;">
  <div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:40px;">
    <header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#f3c623;">Set de base · 12 / 120</div>
        <h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:56px;line-height:.95;letter-spacing:-.01em;">Mèmes de France</h1>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:14px;">
        <sc-for list="{{ types }}" as="t" hint-placeholder-count="6">
          <div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;">
            <div style="width:20px;height:20px;border-radius:50%;background:{{ t.deep }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;box-shadow:0 0 0 1.5px #f1e9da;">{{ t.glyph }}</div>
            <span>{{ t.label }}</span>
          </div>
        </sc-for>
      </div>
    </header>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:36px 32px;">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="12">
        <dc-import name="MemeCard" card="{{ c }}" holo="{{ holo }}" show-flavor="{{ showFlavor }}" frame="{{ frame }}" hint-size="380px,531px"></dc-import>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#f3c623;">Dos de carte</div>
      <div style="width:380px;height:531px;border-radius:18px;overflow:hidden;background:#0a1f5c url('./assets/card-back-doge.png') center/contain no-repeat;box-shadow:0 18px 40px rgba(0,0,0,.35);"></div>
    </div>
  </div>
</div>
