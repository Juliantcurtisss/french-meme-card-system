<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Rubik+Mono+One&display=swap">
<script src="./image-slot.js"></script>
<style>
@property --mx{syntax:'<percentage>';inherits:true;initial-value:30%}
@property --my{syntax:'<percentage>';inherits:true;initial-value:20%}
@property --mxn{syntax:'<number>';inherits:true;initial-value:-0.4}
@property --myn{syntax:'<number>';inherits:true;initial-value:-0.6}
@property --glare{syntax:'<number>';inherits:true;initial-value:0.35}
</style>
</helmet>
<div style="width:380px;height:531px;perspective:1400px;cursor:pointer;-webkit-user-select:none;user-select:none;" onPointerMove="{{ onMove }}" onPointerLeave="{{ onLeave }}" onClick="{{ onFlip }}">
  <div ref="{{ rotor }}" style="position:relative;width:100%;height:100%;transform-style:preserve-3d;">

    <div style="position:absolute;inset:0;border-radius:18px;background:#4a443d;transform:translateZ(-1px);"></div>
    <div style="position:absolute;inset:0;border-radius:18px;background:#36312c;transform:translateZ(-2px);"></div>
    <div style="position:absolute;inset:0;border-radius:18px;background:#0a1f5c;transform:translateZ(-3px);"></div>

    <div style="position:absolute;inset:0;transform:translateZ(-4px) rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden;">
      <div style="position:relative;width:380px;height:531px;border-radius:18px;overflow:hidden;background:#0a1f5c url('./assets/card-back-doge.png') center/113% 113% no-repeat;box-shadow:0 18px 40px rgba(0,0,0,.35);">
        <div style="position:absolute;inset:0;border-radius:18px;pointer-events:none;mix-blend-mode:overlay;background:radial-gradient(circle at calc(100% - var(--mx,30%)) var(--my,20%), rgba(255,255,255,calc(var(--glare,.35) * .55)) 0%, rgba(255,255,255,0) 55%);"></div>
        <div style="position:absolute;inset:0;border-radius:18px;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(calc(245deg - var(--mxn,0) * 55deg), rgba(255,240,190,0) 38%, rgba(255,240,190,calc(var(--glare,.35) * .35)) 48%, rgba(255,240,190,0) 58%);"></div>
      </div>
    </div>

    <div style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;">
      <div style="width:380px;height:531px;box-sizing:border-box;padding:11px;border-radius:18px;background:{{ frameBg }};box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 18px 40px rgba(0,0,0,.35);font-family:'Barlow',sans-serif;color:{{ ink }};position:relative;isolation:isolate;overflow:hidden;">
        <sc-if value="{{ isFull }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0;z-index:-1;background:#e9e3d6;">
            <image-slot id="{{ imageId }}" shape="rect" placeholder="{{ placeholder }}"></image-slot>
          </div>
        </sc-if>
        <div style="height:100%;box-sizing:border-box;border-radius:8px;padding:8px 12px 7px;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;background:{{ faceBg }};box-shadow:{{ faceShadow }};">
          <sc-if value="{{ hasScrim }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg, rgba(8,8,12,.8) 0%, rgba(8,8,12,.4) 12%, rgba(8,8,12,0) 24%, rgba(8,8,12,0) 38%, rgba(8,8,12,.72) 52%, rgba(8,8,12,.92) 100%);"></div>
          </sc-if>

          <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;border-radius:6px;background:{{ headBg }};padding:{{ headPad }};backdrop-filter:{{ blur }};text-shadow:{{ headShadow }};">
            <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
              <div style="align-self:flex-start;white-space:nowrap;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:linear-gradient(180deg,#f2f2f2,#bdbdbd);color:#333;">{{ stage }}</div>
              <div style="display:flex;align-items:center;gap:5px;min-width:0;">
                <div style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:{{ nameSize }};line-height:1.05;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background-image:{{ nameFill }};background-size:220% 100%;background-position:var(--mx,30%) 50%;-webkit-background-clip:{{ nameClip }};background-clip:{{ nameClip }};color:{{ nameColor }};">{{ name }}</div>
                <sc-if value="{{ hasEdition }}" hint-placeholder-val="{{ false }}">
                  <div style="flex-shrink:0;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;font-style:italic;font-weight:800;font-size:15px;line-height:1;letter-spacing:.01em;padding:3px 7px 2px 6px;border-radius:4px;color:#2a2a2a;background:linear-gradient(135deg,#9a9a9a 0%,#f5f5f5 25%,#b9b9b9 50%,#ffffff 72%,#8f8f8f 100%);box-shadow:0 0 0 1px #6f6f6f, 0 1px 3px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.7);">{{ edition }}</div>
                </sc-if>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;color:{{ hpColor }};margin-top:6px;">PV</span>
              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:25px;line-height:1;color:{{ hpColor }};">{{ hp }}</span>
              <div style="width:24px;height:24px;border-radius:50%;background:{{ deep }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 0 0 1.5px #fff, 0 1px 2px rgba(0,0,0,.4);">{{ glyph }}</div>
            </div>
          </div>

          <sc-if value="{{ notFull }}" hint-placeholder-val="{{ true }}">
            <div style="margin-top:5px;padding:4px;border-radius:3px;background:{{ bezel }};box-shadow:0 2px 4px rgba(0,0,0,.25);">
              <div style="position:relative;height:178px;background:#e9e3d6;overflow:hidden;">
                <image-slot id="{{ imageId }}" shape="rect" placeholder="{{ placeholder }}"></image-slot>
                <sc-if value="{{ holoWin }}" hint-placeholder-val="{{ true }}">
                  <div style="position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(115deg, transparent 18%, rgba(255,80,200,.2) 34%, rgba(80,220,255,.22) 50%, rgba(255,235,90,.2) 66%, transparent 82%);background-size:250% 250%;background-position:var(--mx,30%) var(--my,20%);mix-blend-mode:screen;"></div>
                </sc-if>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ isFull }}" hint-placeholder-val="{{ false }}">
            <div style="height:191px;"></div>
          </sc-if>

          <div style="align-self:center;margin-top:-1px;padding:2px 14px;font-size:9.5px;font-style:italic;font-weight:500;color:#1c1a17;background:linear-gradient(180deg,#e9e9e9,#c4c4c4);border-radius:0 0 6px 6px;box-shadow:0 1px 2px rgba(0,0,0,.2);white-space:nowrap;">{{ category }} · {{ origin }}</div>

          <div style="flex:1;display:flex;flex-direction:column;margin-top:9px;border-radius:6px;background:{{ panelBg }};padding:{{ panelPad }};text-shadow:{{ panelShadow }};">
            <div style="display:flex;flex-direction:column;gap:7px;">
              <sc-for list="{{ attacks }}" as="a" hint-placeholder-count="2">
                <div style="display:flex;flex-direction:column;gap:2px;">
                  <div style="display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:6px;">
                    <div style="display:flex;gap:2px;flex-wrap:wrap;">
                      <sc-for list="{{ a.cost }}" as="e" hint-placeholder-count="2">
                        <div style="width:17px;height:17px;border-radius:50%;background:{{ e.deep }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;box-shadow:0 0 0 1px #fff, 0 1px 1.5px rgba(0,0,0,.35);">{{ e.glyph }}</div>
                      </sc-for>
                    </div>
                    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;line-height:1.05;text-wrap:balance;">{{ a.name }}</div>
                    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:21px;line-height:1;min-width:30px;text-align:right;">{{ a.dmg }}</div>
                  </div>
                  <div style="font-size:10.5px;line-height:1.32;text-wrap:pretty;">{{ a.text }}</div>
                </div>
              </sc-for>
            </div>

            <div style="flex:1;"></div>

            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid {{ rule }};padding-top:4px;font-size:8.5px;font-weight:600;">
              <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                <span>faiblesse</span>
                <div style="display:flex;align-items:center;gap:3px;">
                  <div style="width:14px;height:14px;border-radius:50%;background:{{ weak.deep }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:8.5px;">{{ weak.glyph }}</div>
                  <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;">×2</span>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                <span>résistance</span>
                <div style="display:flex;align-items:center;gap:3px;min-height:14px;">
                  <sc-for list="{{ res }}" as="r" hint-placeholder-count="1">
                    <div style="width:14px;height:14px;border-radius:50%;background:{{ r.deep }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:8.5px;">{{ r.glyph }}</div>
                    <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;">−30</span>
                  </sc-for>
                  <sc-if value="{{ noRes }}" hint-placeholder-val="{{ false }}">
                    <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;">—</span>
                  </sc-if>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                <span>retraite</span>
                <div style="display:flex;align-items:center;gap:2px;min-height:14px;">
                  <sc-for list="{{ retreat }}" as="r" hint-placeholder-count="1">
                    <div style="width:14px;height:14px;border-radius:50%;background:{{ r.deep }};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:8.5px;">{{ r.glyph }}</div>
                  </sc-for>
                </div>
              </div>
            </div>

            <sc-if value="{{ showFlavor }}" hint-placeholder-val="{{ true }}">
              <div style="margin-top:5px;padding:4px 7px;border:1px solid {{ deep }};border-radius:3px;background:{{ flavorBg }};font-size:9px;line-height:1.3;font-style:italic;text-wrap:pretty;">{{ flavor }}</div>
            </sc-if>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:7.5px;font-weight:600;letter-spacing:.02em;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:10px;line-height:1;letter-spacing:.04em;color:{{ symColor }};text-shadow:{{ symShadow }};">{{ symbol }}</span>
                <span>Illus. {{ illustrator }}</span>
              </div>
              <span>{{ number }}</span>
            </div>
          </div>

          <sc-if value="{{ hasFoil }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;inset:0;border-radius:8px;pointer-events:none;mix-blend-mode:{{ foilBlend }};opacity:{{ foilOpacity }};background-image:{{ foilBg }};background-size:200% 200%;background-position:var(--mx,30%) var(--my,20%);"></div>
          </sc-if>
          <sc-if value="{{ hasEtch }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:calc(var(--glare,.35) * .95);background:repeating-radial-gradient(circle at var(--mx,30%) var(--my,20%), rgba(255,255,255,0) 0px, rgba(255,255,255,0) 3px, rgba(255,255,255,.55) 3.6px, rgba(255,255,255,0) 4.4px);mask:radial-gradient(circle at var(--mx,30%) var(--my,20%), #000 0%, rgba(0,0,0,.4) 25%, transparent 50%);"></div>
            <div style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:calc(var(--glare,.35) * .5);background:repeating-linear-gradient(calc(60deg + var(--mxn,0) * 30deg), rgba(255,255,255,0) 0px, rgba(255,255,255,0) 9px, rgba(255,255,255,.18) 10px, rgba(255,255,255,0) 11px);"></div>
          </sc-if>
          <sc-if value="{{ hasSparkle }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;inset:-14px;pointer-events:none;mix-blend-mode:screen;opacity:calc({{ sparkleOpacity }} * (.45 + var(--glare,.35)));transform:translate(calc(var(--mxn,0) * -9px), calc(var(--myn,0) * -9px));background:{{ sparkleBg }};"></div>
          </sc-if>
        </div>

        <sc-if value="{{ hasRing }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0;border-radius:18px;pointer-events:none;box-sizing:border-box;padding:{{ ringW }};background:{{ ringBg }};mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);mask-composite:exclude;-webkit-mask-composite:xor;"></div>
          <div style="position:absolute;inset:{{ ringW }};border-radius:15px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28), inset 0 0 6px rgba(0,0,0,.25);"></div>
        </sc-if>
        <div style="position:absolute;inset:0;border-radius:18px;pointer-events:none;mix-blend-mode:overlay;background:radial-gradient(circle at var(--mx,30%) var(--my,20%), rgba(255,255,255,calc(var(--glare,.35) * {{ glareA }})) 0%, rgba(255,255,255,0) 55%);"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:570},&quot;card&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;tier&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;common&quot;,&quot;rare&quot;,&quot;epic&quot;,&quot;legendary&quot;,&quot;mistic&quot;,&quot;fullart&quot;,&quot;shiny&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;holo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showFlavor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;frame&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;jaune&quot;,&quot;argent&quot;,&quot;noir&quot;],&quot;default&quot;:&quot;jaune&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TYPES = {
  raleur:  { label: 'Râleur',  deep: '#cf3f2a', face: '#f3c3b0', glyph: '!' },
  absurde: { label: 'Absurde', deep: '#8549bb', face: '#dbc5ee', glyph: '?' },
  terroir: { label: 'Terroir', deep: '#4c8636', face: '#cde2b5', glyph: '♣' },
  tele:    { label: 'Télé',    deep: '#d79b00', face: '#f7e39a', glyph: '◉' },
  chic:    { label: 'Chic',    deep: '#2c69b0', face: '#c1d6ef', glyph: '✦' },
  gaulois: { label: 'Gaulois', deep: '#8f806a', face: '#e4ddcf', glyph: '★' },
  acier:   { label: 'Acier',   deep: '#5f6f7d', face: '#cfd6dc', glyph: '⬡' },
  confusion: { label: 'Confusion', deep: '#c0397e', face: '#f1c4da', glyph: '@' },
  hard:    { label: 'Hard',    deep: '#2b2724', face: '#bdb5ab', glyph: '▲' },
};
const FRAMES = {
  jaune: 'linear-gradient(160deg,#f7d64a 0%,#eebc1c 50%,#f5cf3a 100%)',
  argent: 'linear-gradient(160deg,#eeeeee 0%,#b8b8b8 45%,#f4f4f4 70%,#a9a9a9 100%)',
  noir: 'linear-gradient(160deg,#3a3632 0%,#1a1816 60%,#34302b 100%)',
  foil: 'linear-gradient(135deg,#f7dc6f 0%,#f4a3d3 18%,#a3d9f7 36%,#c9f2a6 52%,#f7dc6f 68%,#e1b0f5 84%,#f7dc6f 100%)',
  violet: 'linear-gradient(160deg,#d9c2f7 0%,#8a5cc9 40%,#e4d3fa 66%,#6a3fae 100%)',
  or: 'linear-gradient(160deg,#fff1b0 0%,#d4a017 28%,#fff4c2 52%,#b8860b 78%,#ffe58a 100%)',
  aurore: 'linear-gradient(160deg,#0b4d36 0%,#1fa070 26%,#9ff5c8 48%,#0f7a52 70%,#063826 100%)',
  chrome: 'linear-gradient(160deg,#ffffff 0%,#9ea3a8 30%,#f4f6f8 52%,#7d8389 76%,#e9ecef 100%)',
};
const BEZEL = {
  argent: 'linear-gradient(135deg,#9a9a9a 0%,#f5f5f5 22%,#b9b9b9 48%,#ffffff 70%,#8f8f8f 100%)',
  violet: 'linear-gradient(135deg,#7d4fc0 0%,#e4d3fa 25%,#9a6fd6 50%,#f1e6ff 72%,#6a3fae 100%)',
  or: 'linear-gradient(135deg,#b8860b 0%,#fff1b0 24%,#d4a017 50%,#fff8d6 72%,#a8790a 100%)',
  aurore: 'linear-gradient(135deg,#0f7a52 0%,#c8fbe0 24%,#1fa070 50%,#e6fff1 72%,#0b5c3e 100%)',
};
const GLITTER = 'radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.7px) 0 0/23px 29px, radial-gradient(circle, rgba(255,236,170,.9) 0 .8px, transparent 1.5px) 11px 14px/31px 37px, radial-gradient(circle, rgba(200,240,255,.9) 0 1.2px, transparent 2px) 6px 21px/47px 53px';
const STARS = 'radial-gradient(circle, rgba(255,255,255,.9) 0 .8px, transparent 1.5px) 0 0/41px 47px, radial-gradient(circle, rgba(150,255,235,.8) 0 1.1px, transparent 2px) 19px 23px/67px 71px, radial-gradient(circle, rgba(210,170,255,.85) 0 .9px, transparent 1.6px) 7px 31px/53px 59px';
const SPARKS = 'radial-gradient(circle at 18% 22%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px), radial-gradient(circle at 82% 14%, rgba(255,255,255,.85) 0 1px, transparent 2px), radial-gradient(circle at 70% 62%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px), radial-gradient(circle at 26% 78%, rgba(255,255,255,.85) 0 1px, transparent 2px), radial-gradient(circle at 90% 88%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px), radial-gradient(circle at 48% 40%, rgba(255,244,200,.9) 0 1px, transparent 2px), radial-gradient(circle at 10% 55%, rgba(255,244,200,.85) 0 1.2px, transparent 2.2px)';
const RAINBOW = 'repeating-linear-gradient(125deg, rgba(255,90,170,.55) 0px, rgba(255,220,90,.55) 40px, rgba(90,255,190,.55) 80px, rgba(90,170,255,.55) 120px, rgba(200,110,255,.55) 160px, rgba(255,90,170,.55) 200px)';
const PANEL = 'rgba(253,248,238,.8)';
// moving specular highlight: hot spot under the pointer + a sweep band that rotates with tilt
const light = (t, k = 1) => [
  `radial-gradient(circle at var(--mx,30%) var(--my,20%), rgba(${t},calc(var(--glare,.35) * ${k})) 0%, rgba(${t},calc(var(--glare,.35) * ${.35 * k})) ${14 * k}%, rgba(${t},0) ${34 * k}%)`,
  `linear-gradient(calc(115deg + var(--mxn,0) * 55deg), rgba(${t},0) 36%, rgba(${t},calc(var(--glare,.35) * ${.9 * k})) 47%, rgba(${t},calc(var(--glare,.35) * ${.2 * k})) 50%, rgba(${t},0) 60%)`,
  `linear-gradient(calc(295deg + var(--mxn,0) * 55deg), rgba(${t},0) 44%, rgba(${t},calc(var(--glare,.35) * ${.45 * k})) 49%, rgba(${t},0) 54%)`,
  ...(k > 1 ? [
    `radial-gradient(circle at calc(100% - var(--mx,30%)) calc(100% - var(--my,20%)), rgba(${t},calc(var(--glare,.35) * .8)) 0%, rgba(${t},0) 22%)`,
    `linear-gradient(calc(75deg + var(--mxn,0) * 70deg), rgba(${t},0) 20%, rgba(${t},calc(var(--glare,.35) * .7 + .15)) 26%, rgba(${t},0) 32%, rgba(${t},0) 68%, rgba(${t},calc(var(--glare,.35) * .7 + .15)) 74%, rgba(${t},0) 80%)`,
    `repeating-linear-gradient(calc(115deg + var(--mxn,0) * 55deg), rgba(${t},0) 0px, rgba(${t},0) 5px, rgba(${t},calc(var(--glare,.35) * .35 + .1)) 6px, rgba(${t},0) 7px)`,
  ] : []),
].join(', ');
const TIERS = {
  common:    { frame: 'jaune', holoWin: false, symbol: '★', symColor: '#1c1a17', glare: .2 },
  rare:      { frame: 'jaune', holoWin: true, symbol: '★★', symColor: '#5f6f7d', glare: .3 },
  epic:      { frame: 'argent', bezel: 'violet', holoWin: true, symbol: '★★★', symColor: '#7d4fc0', edge: '248,238,255', glare: .4,
               foil: 'linear-gradient(115deg, transparent 22%, rgba(220,190,255,.6) 40%, rgba(255,255,255,.45) 50%, transparent 64%)', foilBlend: 'screen', foilOpacity: .7 },
  legendary: { frame: 'or', bezel: 'or', holoWin: true, symbol: '★★★★', symColor: '#b8860b', symShadow: '0 0 4px rgba(255,210,80,.9)', edge: '255,248,210', shine: 1.5, glare: .45,
               face: 'linear-gradient(160deg,#fbe9a8 0%,#fdf8ee 50%,#f3d77a 100%)',
               name: 'linear-gradient(100deg,#5e4000 0%,#8a6200 30%,#d4a017 45%,#7a5300 60%,#5e4000 100%)',
               foil: 'repeating-linear-gradient(120deg, rgba(255,215,90,0) 0px, rgba(255,232,150,.55) 60px, rgba(255,215,90,0) 120px)', foilBlend: 'overlay', foilOpacity: .9,
               sparkle: SPARKS, sparkleOpacity: 1 },
