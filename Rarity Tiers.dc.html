<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<style>
body{margin:0;background:#1f1b17;}
a{color:#f3c623;}
a:hover{color:#ffe07a;}
</style>
</helmet>
<div style="min-height:100vh;background:#1f1b17;color:#f1e9da;font-family:'Barlow',sans-serif;padding:56px 32px 80px;box-sizing:border-box;">
  <div style="max-width:1760px;margin:0 auto;display:flex;flex-direction:column;gap:44px;">
    <header style="display:flex;flex-direction:column;gap:6px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#f3c623;">Mèmes de France · Raretés</div>
      <h1 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:56px;line-height:.95;letter-spacing:-.01em;">7 niveaux de rareté</h1>
      <div style="font-size:15px;color:#c9bfae;">Survolez pour incliner · cliquez pour retourner</div>
    </header>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:48px 32px;">
      <sc-for list="{{ tiers }}" as="t" hint-placeholder-count="7">
        <div style="display:flex;flex-direction:column;gap:16px;width:380px;">
          <dc-import name="MemeCard" card="{{ card }}" tier="{{ t.key }}" hint-size="380px,531px"></dc-import>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <div style="display:flex;align-items:baseline;gap:10px;">
              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:#f3c623;">{{ t.n }}</span>
              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1;">{{ t.label }}</span>
              <span style="font-size:15px;color:{{ t.color }};">{{ t.symbol }}</span>
            </div>
            <div style="font-size:14px;line-height:1.4;color:#c9bfae;text-wrap:pretty;">{{ t.desc }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const TIERS = [
  { key: 'common', n: '01', label: 'Common', symbol: '★', color: '#f1e9da', desc: 'Cadre jaune, illustration mate. Aucun effet.' },
  { key: 'rare', n: '02', label: 'Uncommon', symbol: '★★', color: '#cfd6dc', desc: 'Cadre jaune, reflet holo sur l’illustration.' },
  { key: 'epic', n: '03', label: 'Rare', symbol: '★★★', color: '#b994ec', desc: 'Cadre argent, reflet violet lumineux sur toute la carte.' },
  { key: 'legendary', n: '04', label: 'Legendary', symbol: '★★★★', color: '#f3c623', desc: 'Cadre or, fond doré, bandes de foil or et éclats.' },
  { key: 'mistic', n: '05', label: 'Mistic', symbol: '★★★★★', color: '#5ee7d0', desc: 'Cadre émeraude, carte violet nuit, foil irisé et poussière d’étoiles.' },
  { key: 'fullart', n: '06', label: 'Full art', symbol: '★★★★★★', color: '#f1e9da', desc: 'Illustration bord à bord, voiles sombres, texte blanc et texture gravée qui scintille sous la lumière.' },
  { key: 'shiny', n: '07', label: 'Shiny', symbol: '★★★★★★★', color: '#f3c623', desc: 'Full art, liseré arc-en-ciel, foil prismatique et paillettes.' },
];
const CARD = { id: 'chirac', name: 'Le Président', hp: 130, type: 'terroir', stage: 'Niveau 2', category: 'Meme Terroir', origin: 'Salon de l’Agriculture',
  attacks: [
    { name: 'Abracadabrantesque', cost: ['terroir', 'gaulois'], dmg: '40', text: 'Le Défenseur est Confus. Il ne comprend pas non plus.' },
    { name: 'Ça m’en touche une…', cost: ['terroir', 'terroir', 'terroir'], dmg: '100', text: 'Cette attaque ignore faiblesses, résistances et tous les effets en jeu.' },
  ], weakness: 'raleur', resistance: 'chic', retreat: 3,
  flavor: '…sans faire bouger l’autre. A caressé plus de vaches que de dossiers.', number: '088/120', illustrator: 'Corrèze' };
class Component extends DCLogic {
  renderVals() { return { tiers: TIERS, card: CARD }; }
}
</script>
</body>
</html>
